<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloomDo - Cute Pastel To-Do</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c084fc">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', 'Poppins', sans-serif; background-color: #faf5ff; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e9d5ff; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-700 pb-24 select-none">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-30 glass border-b border-purple-100 p-4 shadow-sm">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🌸</span>
                <h1 class="text-xl font-bold text-purple-700 tracking-wide">BloomDo</h1>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Language Selector -->
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1.5 rounded-xl border-none focus:ring-2 focus:ring-purple-300">
                    <option value="ar">AR 🇸🇦</option>
                    <option value="fr">FR 🇫🇷</option>
                    <option value="en">EN 🇺🇸</option>
                </select>

                <button onclick="toggleAIModal()" class="bg-gradient-to-r from-purple-400 to-pink-400 text-white px-3 py-1.5 rounded-full text-xs font-bold shadow-md hover:opacity-90 transition flex items-center gap-1">
                    <span>✨</span> <span data-i18n="aiBtn">رتّب يومي</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-4">

        <!-- 1. HOME VIEW -->
        <div id="viewHome" class="space-y-5">
            <!-- Space Switcher Banner -->
            <div class="bg-white/80 rounded-3xl p-4 shadow-sm border border-purple-100 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="text-2xl" id="currentSpaceIcon">📂</span>
                    <div>
                        <span class="text-[10px] text-purple-400 font-bold block" data-i18n="currentSpace">مساحة العمل الحالية</span>
                        <select id="spaceSelect" onchange="changeSpace(this.value)" class="bg-transparent font-bold text-slate-800 focus:outline-none text-sm">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                </div>
                <button onclick="openNewSpaceModal()" class="text-xs bg-purple-100 hover:bg-purple-200 text-purple-700 font-bold px-3 py-1.5 rounded-2xl transition" data-i18n="addSpaceBtn">+ مساحة</button>
            </div>

            <!-- Stats Bar -->
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-purple-100/60 p-3 rounded-2xl">
                    <span class="block text-xs text-purple-600 font-bold" data-i18n="statTasks">المهام</span>
                    <span class="text-base font-extrabold text-purple-800" id="statTasksCount">0</span>
                </div>
                <div class="bg-pink-100/60 p-3 rounded-2xl">
                    <span class="block text-xs text-pink-600 font-bold" data-i18n="statProjects">المشاريع</span>
                    <span class="text-base font-extrabold text-pink-800" id="statProjectsCount">0</span>
                </div>
                <div class="bg-indigo-100/60 p-3 rounded-2xl">
                    <span class="block text-xs text-indigo-600 font-bold" data-i18n="statProgress">الإنجاز</span>
                    <span class="text-base font-extrabold text-indigo-800" id="statProgress">0%</span>
                </div>
            </div>

            <!-- Create / Edit Task/Project Form Container -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-purple-100 space-y-3">
                <div class="flex border-b border-purple-50 pb-2 gap-4">
                    <button onclick="setAddType('task')" id="tabAddTask" class="text-xs font-bold text-purple-600 border-b-2 border-purple-500 pb-1" data-i18n="tabAddTask">إضافة مهمة 📝</button>
                    <button onclick="setAddType('project')" id="tabAddProject" class="text-xs font-bold text-slate-400 pb-1" data-i18n="tabAddProject">إضافة مشروع 📁</button>
                </div>

                <!-- Form Task -->
                <form id="formTask" onsubmit="handleSaveTask(event)" class="space-y-3">
                    <input type="hidden" id="editingTaskId" value="">
                    
                    <input type="text" id="taskTitle" placeholder="عنوان المهمة..." required class="w-full px-4 py-2 rounded-2xl border border-purple-100 focus:outline-none focus:ring-2 focus:ring-purple-200 bg-purple-50/20 text-xs" data-i18n-ph="taskTitlePlaceholder">
                    
                    <div class="flex gap-2">
                        <select id="taskProjectSelect" class="w-1/2 px-3 py-1.5 rounded-2xl border border-purple-100 text-xs text-slate-600 bg-purple-50/20 focus:outline-none">
                            <!-- Populated dynamically -->
                        </select>
                        <input type="date" id="taskDate" class="w-1/2 px-3 py-1.5 rounded-2xl border border-purple-100 text-xs text-slate-600 bg-purple-50/20">
                    </div>

                    <!-- Time Range Inputs -->
                    <div class="flex items-center gap-2 bg-purple-50/30 p-2 rounded-2xl border border-purple-100 text-xs">
                        <span class="text-slate-500 font-bold text-[10px]" data-i18n="from">من:</span>
                        <input type="time" id="taskStartTime" class="w-1/2 bg-white px-2 py-1 rounded-xl border border-purple-100 text-slate-600 text-xs">
                        <span class="text-slate-500 font-bold text-[10px]" data-i18n="to">إلى:</span>
                        <input type="time" id="taskEndTime" class="w-1/2 bg-white px-2 py-1 rounded-xl border border-purple-100 text-slate-600 text-xs">
                    </div>

                    <!-- Status Selection -->
                    <div class="flex items-center gap-2">
                        <label class="text-[11px] font-bold text-slate-500" data-i18n="statusLabel">الحالة:</label>
                        <select id="taskStatusSelect" class="flex-1 px-3 py-1.5 rounded-2xl border border-purple-100 text-xs bg-purple-50/20 text-slate-700 font-bold focus:outline-none">
                            <option value="pending" data-i18n="statusPending">⏳ لم تنجز بعد</option>
                            <option value="in_progress" data-i18n="statusInProgress">🔄 قيد الإنجاز</option>
                            <option value="done" data-i18n="statusDone">✅ أنجزت / اكتملت</option>
                            <option value="cancelled" data-i18n="statusCancelled">❌ ملغية</option>
                        </select>
                    </div>

                    <!-- Color Picker Section -->
                    <div class="flex items-center justify-between pt-1">
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] font-bold text-slate-500" data-i18n="colorLabel">اللون:</span>
                            <div class="flex gap-1.5 items-center">
                                <button type="button" onclick="selectColor('#FCE7F3')" class="w-5 h-5 rounded-full bg-pink-200 border-2 border-white ring-1 ring-purple-200"></button>
                                <button type="button" onclick="selectColor('#F3E8FF')" class="w-5 h-5 rounded-full bg-purple-200 border-2 border-white ring-1 ring-purple-200"></button>
                                <button type="button" onclick="selectColor('#E0E7FF')" class="w-5 h-5 rounded-full bg-indigo-200 border-2 border-white ring-1 ring-purple-200"></button>
                                <button type="button" onclick="selectColor('#FEF3C7')" class="w-5 h-5 rounded-full bg-amber-200 border-2 border-white ring-1 ring-purple-200"></button>
                                <!-- Custom Color Input -->
                                <input type="color" id="customColorPicker" onchange="selectColor(this.value)" value="#f3e8ff" class="w-6 h-6 rounded-full cursor-pointer border-0 bg-transparent p-0" title="اختر لوناً مخصصاً">
                            </div>
                        </div>

                        <div class="flex gap-1">
                            <button type="button" id="btnCancelEdit" onclick="cancelEditTask()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-2xl font-bold text-xs transition" data-i18n="cancel">إلغاء</button>
                            <button type="submit" id="btnSaveTask" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-1.5 rounded-2xl font-bold text-xs transition" data-i18n="saveTask">حفظ المهمة</button>
                        </div>
                    </div>
                </form>

                <!-- Form Project -->
                <form id="formProject" onsubmit="handleAddProject(event)" class="space-y-3 hidden">
                    <input type="text" id="projectTitle" placeholder="اسم المشروع الجديد..." required class="w-full px-4 py-2 rounded-2xl border border-purple-100 focus:outline-none focus:ring-2 focus:ring-purple-200 bg-purple-50/20 text-xs" data-i18n-ph="projectTitlePlaceholder">
                    <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white py-2 rounded-2xl font-bold text-xs transition" data-i18n="createProject">إنشاء المشروع</button>
                </form>
            </div>

            <!-- Projects Section -->
            <div id="projectsContainer" class="space-y-3">
                <!-- Projects Rendered Here -->
            </div>

            <!-- Standalone Tasks Section -->
            <div>
                <h3 class="text-xs font-bold text-purple-900 mb-2 px-1" data-i18n="standaloneTasks">مهام مستقلة 🌸</h3>
                <div id="standaloneTasksContainer" class="space-y-2">
                    <!-- Tasks Rendered Here -->
                </div>
            </div>
        </div>

        <!-- 2. TODAY VIEW -->
        <div id="viewToday" class="space-y-4 hidden">
            <h2 class="text-base font-bold text-purple-900" data-i18n="todayTitle">جدول مهام اليوم ☀️</h2>
            <div id="todayTasksContainer" class="space-y-2">
                <!-- Today Tasks Rendered Here -->
            </div>
        </div>

        <!-- 3. CALENDAR VIEW -->
        <div id="viewCalendar" class="space-y-4 hidden">
            <h2 class="text-base font-bold text-purple-900" data-i18n="calendarTitle">التقويم الشهري 📅</h2>
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-purple-100">
                <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-purple-400 mb-2" id="calendarHeaderDays">
                    <!-- Day names -->
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-xs">
                    <!-- Dynamic Calendar Grid -->
                </div>
            </div>

            <!-- Tasks for Selected Date -->
            <div class="bg-white/80 rounded-3xl p-4 shadow-sm border border-purple-100 space-y-3">
                <h3 class="text-xs font-bold text-purple-900 border-b border-purple-50 pb-2 flex justify-between items-center">
                    <span data-i18n="tasksForDate">مهام اليوم المحدد:</span>
                    <span id="selectedDateDisplay" class="text-purple-600 font-extrabold">-</span>
                </h3>
                <div id="calendarSelectedDateTasks" class="space-y-2">
                    <!-- Selected Date Tasks Rendered Here -->
                </div>
            </div>
        </div>

    </main>

    <!-- Navigation Bar at Bottom -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-purple-100 px-6 py-3 z-30">
        <div class="max-w-md mx-auto flex justify-between items-center text-slate-400">
            <button onclick="switchView('home')" id="navHome" class="flex flex-col items-center gap-1 text-purple-600">
                <span class="text-lg">🏠</span>
                <span class="text-[10px] font-bold" data-i18n="navHome">الرئيسية</span>
            </button>
            <button onclick="switchView('today')" id="navToday" class="flex flex-col items-center gap-1 hover:text-purple-600">
                <span class="text-lg">☀️</span>
                <span class="text-[10px] font-bold" data-i18n="navToday">اليوم</span>
            </button>
            <button onclick="switchView('calendar')" id="navCalendar" class="flex flex-col items-center gap-1 hover:text-purple-600">
                <span class="text-lg">📅</span>
                <span class="text-[10px] font-bold" data-i18n="navCalendar">التقويم</span>
            </button>
        </div>
    </nav>

    <!-- MODAL: NEW SPACE -->
    <div id="spaceModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-5 max-w-xs w-full shadow-xl space-y-3">
            <h3 class="font-bold text-sm text-purple-900" data-i18n="newSpaceTitle">مساحة عمل جديدة 📂</h3>
            <input type="text" id="spaceNameInput" placeholder="اسم المساحة..." class="w-full px-3 py-2 rounded-2xl border border-purple-100 text-xs focus:outline-none" data-i18n-ph="spaceNamePlaceholder">
            <div class="flex gap-2 justify-end">
                <button onclick="closeNewSpaceModal()" class="px-3 py-1.5 text-xs text-slate-400 font-bold" data-i18n="cancel">إلغاء</button>
                <button onclick="saveNewSpace()" class="px-4 py-1.5 bg-purple-600 text-white text-xs font-bold rounded-2xl" data-i18n="save">حفظ</button>
            </div>
        </div>
    </div>

    <!-- MODAL: AI SUGGESTIONS -->
    <div id="aiModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-purple-100 space-y-4 text-center">
            <div class="text-4xl">✨</div>
            <h3 class="font-bold text-base text-purple-900" data-i18n="aiModalTitle">مقترح الذكاء الاصطناعي اليومي</h3>
            <p class="text-xs text-slate-600 leading-relaxed" id="aiSuggestionText">...</p>
            <button onclick="toggleAIModal()" class="w-full bg-purple-600 text-white py-2.5 rounded-2xl text-xs font-bold" data-i18n="thanks">شكراً، فهمت!</button>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Translations Dictionary
        const i18n = {
            ar: {
                aiBtn: "رتّب يومي", currentSpace: "مساحة العمل الحالية", addSpaceBtn: "+ مساحة",
                statTasks: "المهام", statProjects: "المشاريع", statProgress: "الإنجاز",
                tabAddTask: "إضافة مهمة 📝", tabAddProject: "إضافة مشروع 📁",
                taskTitlePlaceholder: "عنوان المهمة...", projectTitlePlaceholder: "اسم المشروع الجديد...",
                noProjectOption: "مباشرة في المساحة (بدون مشروع)", from: "من:", to: "إلى:",
                statusLabel: "الحالة:", colorLabel: "اللون:", saveTask: "حفظ المهمة", updateTask: "تحديث المهمة",
                cancel: "إلغاء", createProject: "إنشاء المشروع", standaloneTasks: "مهام مستقلة 🌸",
                todayTitle: "جدول مهام اليوم ☀️", calendarTitle: "التقويم الشهري 📅",
                tasksForDate: "مهام اليوم المحدد:", navHome: "الرئيسية", navToday: "اليوم", navCalendar: "التقويم",
                newSpaceTitle: "مساحة عمل جديدة 📂", spaceNamePlaceholder: "اسم المساحة...", save: "حفظ",
                aiModalTitle: "مقترح الذكاء الاصطناعي اليومي", thanks: "شكراً، فهمت!",
                statusPending: "⏳ لم تنجز بعد", statusInProgress: "🔄 قيد الإنجاز", statusDone: "✅ أنجزت / اكتملت", statusCancelled: "❌ ملغية",
                noTasksInSpace: "لا توجد مهام حرة 🌸", noTasksToday: "لا توجد مهام مجدولة لليوم ☀️", noTasksForSelectedDate: "لا توجد مهام مجدولة في هذا اليوم 📅",
                days: ["ح", "ن", "ث", "ع", "خ", "ج", "س"]
            },
            fr: {
                aiBtn: "Planifier", currentSpace: "Espace Actuel", addSpaceBtn: "+ Espace",
                statTasks: "Tâches", statProjects: "Projets", statProgress: "Progrès",
                tabAddTask: "Ajouter Tâche 📝", tabAddProject: "Ajouter Projet 📁",
                taskTitlePlaceholder: "Titre de la tâche...", projectTitlePlaceholder: "Nom du projet...",
                noProjectOption: "Directement dans l'espace (Sans projet)", from: "De:", to: "À:",
                statusLabel: "Statut:", colorLabel: "Couleur:", saveTask: "Enregistrer", updateTask: "Mettre à jour",
                cancel: "Annuler", createProject: "Créer le Projet", standaloneTasks: "Tâches Indépendantes 🌸",
                todayTitle: "Tâches d'aujourd'hui ☀️", calendarTitle: "Calendrier Mensuel 📅",
                tasksForDate: "Tâches pour le:", navHome: "Accueil", navToday: "Aujourd'hui", navCalendar: "Calendrier",
                newSpaceTitle: "Nouvel Espace 📂", spaceNamePlaceholder: "Nom de l'espace...", save: "Enregistrer",
                aiModalTitle: "Suggestion de l'IA", thanks: "Merci, compris!",
                statusPending: "⏳ En attente", statusInProgress: "🔄 En cours", statusDone: "✅ Terminée", statusCancelled: "❌ Annulée",
                noTasksInSpace: "Aucune tâche libre 🌸", noTasksToday: "Aucune tâche pour aujourd'hui ☀️", noTasksForSelectedDate: "Aucune tâche pour cette date 📅",
                days: ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"]
            },
            en: {
                aiBtn: "Plan My Day", currentSpace: "Current Workspace", addSpaceBtn: "+ Space",
                statTasks: "Tasks", statProjects: "Projects", statProgress: "Progress",
                tabAddTask: "Add Task 📝", tabAddProject: "Add Project 📁",
                taskTitlePlaceholder: "Task title...", projectTitlePlaceholder: "Project name...",
                noProjectOption: "Directly in space (No project)", from: "From:", to: "To:",
                statusLabel: "Status:", colorLabel: "Color:", saveTask: "Save Task", updateTask: "Update Task",
                cancel: "Cancel", createProject: "Create Project", standaloneTasks: "Standalone Tasks 🌸",
                todayTitle: "Today's Schedule ☀️", calendarTitle: "Monthly Calendar 📅",
                tasksForDate: "Tasks for selected date:", navHome: "Home", navToday: "Today", navCalendar: "Calendar",
                newSpaceTitle: "New Workspace 📂", spaceNamePlaceholder: "Space name...", save: "Save",
                aiModalTitle: "Daily AI Suggestion", thanks: "Thanks, got it!",
                statusPending: "⏳ Pending", statusInProgress: "🔄 In Progress", statusDone: "✅ Completed", statusCancelled: "❌ Cancelled",
                noTasksInSpace: "No standalone tasks 🌸", noTasksToday: "No tasks scheduled for today ☀️", noTasksForSelectedDate: "No tasks for this date 📅",
                days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
            }
        };

        let currentLang = 'ar';

        // Local Storage State
        let appData = JSON.parse(localStorage.getItem('bloom_app_data_v2') || JSON.stringify({
            currentSpaceId: 'default',
            spaces: [{ id: 'default', name: 'المساحة الشخصية 🌸', icon: '🌸' }],
            projects: [],
            tasks: []
        }));

        let activeColor = '#F3E8FF';
        let selectedCalendarDate = new Date().toISOString().split('T')[0];

        function saveData() {
            localStorage.setItem('bloom_app_data_v2', JSON.stringify(appData));
            render();
        }

        // Language Switching
        function changeLanguage(lang) {
            currentLang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            
            // Translate static elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(i18n[lang][key]) el.innerText = i18n[lang][key];
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if(i18n[lang][key]) el.placeholder = i18n[lang][key];
            });

            render();
        }

        function selectColor(color) { 
            activeColor = color; 
            document.getElementById('customColorPicker').value = color;
        }

        function setAddType(type) {
            const formTask = document.getElementById('formTask');
            const formProject = document.getElementById('formProject');
            const tabTask = document.getElementById('tabAddTask');
            const tabProject = document.getElementById('tabAddProject');

            if(type === 'task') {
                formTask.classList.remove('hidden');
                formProject.classList.add('hidden');
                tabTask.className = "text-xs font-bold text-purple-600 border-b-2 border-purple-500 pb-1";
                tabProject.className = "text-xs font-bold text-slate-400 pb-1";
            } else {
                formTask.classList.add('hidden');
                formProject.classList.remove('hidden');
                tabProject.className = "text-xs font-bold text-pink-600 border-b-2 border-pink-500 pb-1";
                tabTask.className = "text-xs font-bold text-slate-400 pb-1";
            }
        }

        function changeSpace(id) {
            appData.currentSpaceId = id;
            saveData();
        }

        function openNewSpaceModal() { document.getElementById('spaceModal').classList.remove('hidden'); }
        function closeNewSpaceModal() { document.getElementById('spaceModal').classList.add('hidden'); }

        function saveNewSpace() {
            const name = document.getElementById('spaceNameInput').value.trim();
            if(!name) return;
            const newSpace = { id: 'space_' + Date.now(), name, icon: '📂' };
            appData.spaces.push(newSpace);
            appData.currentSpaceId = newSpace.id;
            document.getElementById('spaceNameInput').value = '';
            closeNewSpaceModal();
            saveData();
        }

        // Add or Update Task
        function handleSaveTask(e) {
            e.preventDefault();
            const editingId = document.getElementById('editingTaskId').value;
            const title = document.getElementById('taskTitle').value.trim();
            const projectId = document.getElementById('taskProjectSelect').value || null;
            const date = document.getElementById('taskDate').value;
            const startTime = document.getElementById('taskStartTime').value;
            const endTime = document.getElementById('taskEndTime').value;
            const status = document.getElementById('taskStatusSelect').value;

            if(editingId) {
                // Edit existing
                appData.tasks = appData.tasks.map(t => {
                    if(t.id === editingId) {
                        return { ...t, title, projectId, date, startTime, endTime, status, color: activeColor };
                    }
                    return t;
                });
            } else {
                // Add new
                const newTask = {
                    id: 'task_' + Date.now(),
                    spaceId: appData.currentSpaceId,
                    projectId, title, date, startTime, endTime, status, color: activeColor
                };
                appData.tasks.push(newTask);
            }

            cancelEditTask();
            saveData();
        }

        function editTask(id) {
            const task = appData.tasks.find(t => t.id === id);
            if(!task) return;

            document.getElementById('editingTaskId').value = task.id;
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskProjectSelect').value = task.projectId || '';
            document.getElementById('taskDate').value = task.date || '';
            document.getElementById('taskStartTime').value = task.startTime || '';
            document.getElementById('taskEndTime').value = task.endTime || '';
            document.getElementById('taskStatusSelect').value = task.status || 'pending';
            selectColor(task.color || '#F3E8FF');

            document.getElementById('btnSaveTask').innerText = i18n[currentLang].updateTask;
            document.getElementById('btnCancelEdit').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEditTask() {
            document.getElementById('formTask').reset();
            document.getElementById('editingTaskId').value = '';
            document.getElementById('btnSaveTask').innerText = i18n[currentLang].saveTask;
            document.getElementById('btnCancelEdit').classList.add('hidden');
            selectColor('#F3E8FF');
        }

        function handleAddProject(e) {
            e.preventDefault();
            const title = document.getElementById('projectTitle').value.trim();
            appData.projects.push({ id: 'proj_' + Date.now(), spaceId: appData.currentSpaceId, title });
            document.getElementById('formProject').reset();
            setAddType('task');
            saveData();
        }

        function changeTaskStatus(id, newStatus) {
            appData.tasks = appData.tasks.map(t => {
                if(t.id === id) {
                    if(newStatus === 'done' && t.status !== 'done') {
                        confetti({ particleCount: 40, spread: 50, origin: { y: 0.8 } });
                    }
                    return { ...t, status: newStatus };
                }
                return t;
            });
            saveData();
        }

        function deleteTask(id) {
            appData.tasks = appData.tasks.filter(t => t.id !== id);
            saveData();
        }

        function deleteProject(id) {
            appData.projects = appData.projects.filter(p => p.id !== id);
            appData.tasks = appData.tasks.filter(t => t.projectId !== id);
            saveData();
        }

        // Render Application UI
        function render() {
            const t = i18n[currentLang];

            // Render Space Select
            const spaceSelect = document.getElementById('spaceSelect');
            spaceSelect.innerHTML = appData.spaces.map(s => `<option value="${s.id}" ${s.id === appData.currentSpaceId ? 'selected' : ''}>${s.name}</option>`).join('');

            // Render Project Select
            const projectSelect = document.getElementById('taskProjectSelect');
            const currentProjects = appData.projects.filter(p => p.spaceId === appData.currentSpaceId);
            projectSelect.innerHTML = `<option value="">${t.noProjectOption}</option>` + 
                currentProjects.map(p => `<option value="${p.id}">${p.title}</option>`).join('');

            // Filter Current Space Tasks
            const currentTasks = appData.tasks.filter(t => t.spaceId === appData.currentSpaceId);

            // Stats
            document.getElementById('statTasksCount').innerText = currentTasks.length;
            document.getElementById('statProjectsCount').innerText = currentProjects.length;
            const completedCount = currentTasks.filter(t => t.status === 'done').length;
            const progress = currentTasks.length ? Math.round((completedCount / currentTasks.length) * 100) : 0;
            document.getElementById('statProgress').innerText = progress + '%';

            // Projects Render
            const projectsContainer = document.getElementById('projectsContainer');
            projectsContainer.innerHTML = currentProjects.map(proj => {
                const projTasks = currentTasks.filter(task => task.projectId === proj.id);
                const projDone = projTasks.filter(task => task.status === 'done').length;
                const projPct = projTasks.length ? Math.round((projDone / projTasks.length) * 100) : 0;

                return `
                    <div class="bg-white/90 rounded-3xl p-4 shadow-sm border border-purple-100 space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-xs text-purple-900">📁 ${proj.title}</span>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold text-purple-500">${projPct}%</span>
                                <button onclick="deleteProject('${proj.id}')" class="text-slate-300 hover:text-red-400 text-xs">✕</button>
                            </div>
                        </div>
                        <div class="w-full bg-purple-50 rounded-full h-1.5 overflow-hidden">
                            <div class="bg-purple-500 h-1.5 rounded-full transition-all duration-300" style="width: ${projPct}%"></div>
                        </div>
                        <div class="space-y-1.5 pt-1">
                            ${projTasks.map(tk => renderTaskCard(tk)).join('') || `<p class="text-[10px] text-slate-300 text-center py-1">-</p>`}
                        </div>
                    </div>
                `;
            }).join('');

            // Standalone Tasks
            const standaloneTasksContainer = document.getElementById('standaloneTasksContainer');
            const standaloneTasks = currentTasks.filter(tk => !tk.projectId);
            standaloneTasksContainer.innerHTML = standaloneTasks.map(tk => renderTaskCard(tk)).join('') || `<p class="text-xs text-slate-400 text-center py-3">${t.noTasksInSpace}</p>`;

            // Today Tasks
            const todayStr = new Date().toISOString().split('T')[0];
            const todayTasks = appData.tasks.filter(tk => tk.date === todayStr);
            document.getElementById('todayTasksContainer').innerHTML = todayTasks.map(tk => renderTaskCard(tk)).join('') || `<p class="text-xs text-slate-400 text-center py-4">${t.noTasksToday}</p>`;

            renderCalendar();
            renderSelectedDateTasks();
        }

        // Render Task Card with Status Switcher and Edit Button
        function renderTaskCard(tk) {
            const t = i18n[currentLang];

            let timeStr = '';
            if(tk.startTime || tk.endTime) {
                timeStr = `⏰ ${tk.startTime || ''} ${tk.endTime ? '→ ' + tk.endTime : ''}`;
            }

            return `
                <div class="p-3 rounded-2xl flex items-center justify-between shadow-sm border border-black/5" style="background-color: ${tk.color || '#F3E8FF'}">
                    <div class="flex items-center gap-2.5 flex-1">
                        <div>
                            <p class="font-bold text-xs ${tk.status === 'done' ? 'line-through text-slate-400' : 'text-slate-800'}">${tk.title}</p>
                            <div class="flex flex-wrap gap-2 text-[9px] text-slate-500 font-medium mt-0.5">
                                ${tk.date ? `<span>📅 ${tk.date}</span>` : ''}
                                ${timeStr ? `<span>${timeStr}</span>` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-1.5">
                        <!-- Status Selector Dropdown -->
                        <select onchange="changeTaskStatus('${tk.id}', this.value)" class="text-[10px] font-bold rounded-xl px-1.5 py-1 bg-white/80 border border-purple-100 text-slate-700 focus:outline-none">
                            <option value="pending" ${tk.status === 'pending' ? 'selected' : ''}>⏳</option>
                            <option value="in_progress" ${tk.status === 'in_progress' ? 'selected' : ''}>🔄</option>
                            <option value="done" ${tk.status === 'done' ? 'selected' : ''}>✅</option>
                            <option value="cancelled" ${tk.status === 'cancelled' ? 'selected' : ''}>❌</option>
                        </select>

                        <!-- Edit Button -->
                        <button onclick="editTask('${tk.id}')" class="text-slate-400 hover:text-purple-600 text-xs p-1" title="تعديل">✏️</button>
                        
                        <!-- Delete Button -->
                        <button onclick="deleteTask('${tk.id}')" class="text-slate-300 hover:text-red-500 text-xs p-1">✕</button>
                    </div>
                </div>
            `;
        }

        // Calendar Logic
        function renderCalendar() {
            const headerDays = document.getElementById('calendarHeaderDays');
            headerDays.innerHTML = i18n[currentLang].days.map(d => `<span>${d}</span>`).join('');

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth(); // Current Month
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for(let i = 1; i <= daysInMonth; i++) {
                const dayPadded = i < 10 ? '0' + i : i;
                const monthPadded = (month + 1) < 10 ? '0' + (month + 1) : (month + 1);
                const dateStr = `${year}-${monthPadded}-${dayPadded}`;
                
                const hasTasks = appData.tasks.some(tk => tk.date === dateStr);
                const isSelected = selectedCalendarDate === dateStr;

                grid.innerHTML += `
                    <div onclick="selectCalendarDate('${dateStr}')" class="p-2 rounded-2xl cursor-pointer transition ${isSelected ? 'ring-2 ring-purple-600 bg-purple-200 font-bold' : hasTasks ? 'bg-purple-100 font-bold text-purple-800' : 'bg-purple-50/50 text-slate-500 hover:bg-purple-100'}">
                        <span>${i}</span>
                        ${hasTasks ? '<span class="block w-1.5 h-1.5 bg-purple-600 rounded-full mx-auto mt-0.5"></span>' : ''}
                    </div>
                `;
            }
        }

        function selectCalendarDate(dateStr) {
            selectedCalendarDate = dateStr;
            renderCalendar();
            renderSelectedDateTasks();
        }

        function renderSelectedDateTasks() {
            document.getElementById('selectedDateDisplay').innerText = selectedCalendarDate || '-';
            const tasks = appData.tasks.filter(tk => tk.date === selectedCalendarDate);
            const container = document.getElementById('calendarSelectedDateTasks');
            container.innerHTML = tasks.map(tk => renderTaskCard(tk)).join('') || `<p class="text-xs text-slate-400 text-center py-2">${i18n[currentLang].noTasksForSelectedDate}</p>`;
        }

        // Views Switcher
        function switchView(view) {
            ['Home', 'Today', 'Calendar'].forEach(v => {
                document.getElementById('view' + v).classList.add('hidden');
                document.getElementById('nav' + v).className = "flex flex-col items-center gap-1 text-slate-400";
            });
            document.getElementById('view' + view.charAt(0).toUpperCase() + view.slice(1)).classList.remove('hidden');
            document.getElementById('nav' + view.charAt(0).toUpperCase() + view.slice(1)).className = "flex flex-col items-center gap-1 text-purple-600 font-bold";
        }

        // AI Modal
        function toggleAIModal() {
            const modal = document.getElementById('aiModal');
            if(modal.classList.contains('hidden')) {
                const suggestions = [
                    "🌸 حاول تحديد وقت محدد لكل مهمة لترتيب يومك دون ضغوط!",
                    "✨ تنظيم المهام بين قيد الإنجاز واكتمالها يمنحك شعوراً رائعاً بالإنجاز.",
                    "🌷 يمكنك تغيير ألوان المهام لتحديد الأولويات بسهولة."
                ];
                document.getElementById('aiSuggestionText').innerText = suggestions[Math.floor(Math.random() * suggestions.length)];
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        // Initialization
        changeLanguage('ar');
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
    </script>
</body>
</html>
