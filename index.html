<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloomDo - Cute Pastel To-Do</title>
    <!-- ربط ملف الـ PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c084fc">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #faf5ff; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-slate-700 pb-20">

    <!-- Header -->
    <header class="sticky top-0 z-30 glass border-b border-purple-100 p-4 shadow-sm mb-6">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-purple-600 flex items-center gap-2">
                <span>🌸</span> BloomDo
            </h1>
            <button onclick="openAIModal()" class="bg-purple-500 hover:bg-purple-600 text-white px-3 py-1.5 rounded-full text-sm font-medium shadow-md transition flex items-center gap-1">
                <span>✨</span> رتّب يومي
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4">
        
        <!-- Quick Add Section -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-purple-100 mb-6">
            <h2 class="text-lg font-bold text-purple-900 mb-3">مهمة جديدة ✨</h2>
            <form id="taskForm" onsubmit="handleAddTask(event)" class="space-y-3">
                <input type="text" id="taskTitle" placeholder="ماذا تريد أن تفعل اليوم؟" required class="w-full px-4 py-2.5 rounded-2xl border border-purple-100 focus:outline-none focus:ring-2 focus:ring-purple-300 bg-purple-50/30 text-sm">
                
                <div class="flex gap-2">
                    <input type="date" id="taskDate" class="w-1/2 px-3 py-2 rounded-2xl border border-purple-100 text-xs text-slate-600 bg-purple-50/30">
                    <input type="time" id="taskTime" class="w-1/2 px-3 py-2 rounded-2xl border border-purple-100 text-xs text-slate-600 bg-purple-50/30">
                </div>

                <div class="flex justify-between items-center pt-1">
                    <div class="flex gap-1.5" id="colorPicker">
                        <button type="button" onclick="selectColor('#FCE7F3')" class="w-6 h-6 rounded-full bg-pink-200 border-2 border-white ring-2 ring-transparent focus:ring-pink-400"></button>
                        <button type="button" onclick="selectColor('#F3E8FF')" class="w-6 h-6 rounded-full bg-purple-200 border-2 border-white ring-2 ring-transparent focus:ring-purple-400"></button>
                        <button type="button" onclick="selectColor('#E0E7FF')" class="w-6 h-6 rounded-full bg-indigo-200 border-2 border-white ring-2 ring-transparent focus:ring-indigo-400"></button>
                        <button type="button" onclick="selectColor('#FEF3C7')" class="w-6 h-6 rounded-full bg-amber-200 border-2 border-white ring-2 ring-transparent focus:ring-amber-400"></button>
                    </div>
                    <button type="submit" class="bg-purple-600 text-white px-5 py-2 rounded-2xl font-medium text-sm hover:bg-purple-700 transition">إضافة</button>
                </div>
            </form>
        </div>

        <!-- Task List -->
        <div class="space-y-3" id="taskList">
            <!-- Tasks rendered dynamically -->
        </div>
    </main>

    <!-- AI Suggestion Modal -->
    <div id="aiModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-xl border border-purple-100 space-y-4 text-center">
            <div class="text-4xl">✨</div>
            <h3 class="font-bold text-lg text-purple-900">اقتراح الذكاء الاصطناعي لتنظيم يومك</h3>
            <p class="text-xs text-slate-500 leading-relaxed" id="aiText">
                ابدأ بالمهمة الأكثر أهمية صباحاً، ولا تنسَ أخذ استراحة لمدة 15 دقيقة بعد إنجاز المهام الكبيرة! 🌸
            </p>
            <button onclick="closeAIModal()" class="w-full bg-purple-600 text-white py-2.5 rounded-2xl font-medium text-sm">فهمت ذلك!</button>
        </div>
    </div>

    <!-- Script for Logic and PWA Register -->
    <script>
        let selectedColor = '#F3E8FF';
        let tasks = JSON.parse(localStorage.getItem('bloom_tasks') || '[]');

        function selectColor(color) {
            selectedColor = color;
        }

        function handleAddTask(e) {
            e.preventDefault();
            const title = document.getElementById('taskTitle').value;
            const date = document.getElementById('taskDate').value;
            const time = document.getElementById('taskTime').value;

            const newTask = {
                id: Date.now(),
                title,
                date,
                time,
                color: selectedColor,
                status: 'pending'
            };

            tasks.push(newTask);
            saveAndRender();
            document.getElementById('taskForm').reset();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => {
                if(t.id === id) {
                    const newStatus = t.status === 'done' ? 'pending' : 'done';
                    if(newStatus === 'done') confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
                    return { ...t, status: newStatus };
                }
                return t;
            });
            saveAndRender();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('bloom_tasks', JSON.stringify(tasks));
            const list = document.getElementById('taskList');
            list.innerHTML = tasks.map(t => `
                <div class="p-4 rounded-3xl shadow-sm border border-purple-100/50 flex items-center justify-between transition hover:shadow-md" style="background-color: ${t.color}">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${t.status === 'done' ? 'checked' : ''} onchange="toggleTask(${t.id})" class="w-5 h-5 accent-purple-600 rounded-lg cursor-pointer">
                        <div>
                            <p class="font-medium text-sm ${t.status === 'done' ? 'line-through text-slate-400' : 'text-slate-800'}">${t.title}</p>
                            ${t.date ? `<span class="text-[10px] text-slate-500">📅 ${t.date}${t.time || ''}</span>` : ''}
                        </div>
                    </div>
                    <button onclick="deleteTask(${t.id})" class="text-slate-400 hover:text-red-500 text-xs p-1">✕</button>
                </div>
            `).join('');
        }

        function openAIModal() { document.getElementById('aiModal').classList.remove('hidden'); }
        function closeAIModal() { document.getElementById('aiModal').classList.add('hidden'); }

        // Initial render
        saveAndRender();

        // تسجيل الـ Service Worker ليعمل بدون إنترنت
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
